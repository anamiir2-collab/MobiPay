name: Import MobiPay Flutter project

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-mobipay.yml"

permissions:
  contents: write

jobs:
  extract-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract project and add missing files only
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="MobiPay-Flutter-Project.zip"
          test -f "$ZIP_FILE"

          mkdir -p .import_tmp
          unzip -q "$ZIP_FILE" -d .import_tmp

          SOURCE=".import_tmp/MobiPay-Flutter-Project/mobipay"
          test -d "$SOURCE"
          test -f "$SOURCE/pubspec.yaml"
          test -f "$SOURCE/lib/main.dart"

          # Copy into repository root, skipping every existing file.
          cp -an "$SOURCE/." .

          # Verify every archive file has a destination before deleting the archive.
          while IFS= read -r -d '' source_file; do
            rel="${source_file#"$SOURCE"/}"
            test -f "$rel"
          done < <(find "$SOURCE" -type f -print0)

          test -f "pubspec.yaml"
          test -f "lib/main.dart"
          test -d "lib/screens"

          SOURCE_COUNT=$(find "$SOURCE" -type f | wc -l)
          DEST_COUNT=$(find . -path './.git' -prune -o -path './.import_tmp' -prune -o -type f -print | wc -l)
          echo "Verified $SOURCE_COUNT source files; repository currently has $DEST_COUNT files."

          # Delete the original ZIP only after successful extraction and verification.
          rm -rf .import_tmp
          rm "$ZIP_FILE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import MobiPay Flutter project files"
            git push
          fi

          echo "Merge completed. Existing files were preserved and the source ZIP was removed."

name: Build MobiPay Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-android.yml"
      - "lib/**"
      - "pubspec.yaml"
      - "pubspec.lock"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform project
        run: flutter create --platforms=android --org com.mobipay .

      - name: Add Android permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.NFC" />',
              '    <uses-permission android:name="android.permission.CAMERA" />',
              '    <uses-permission android:name="android.permission.VIBRATE" />',
              '    <uses-permission android:name="android.permission.USE_BIOMETRIC" />',
              '    <uses-feature android:name="android.hardware.nfc" android:required="false" />',
              '    <uses-feature android:name="android.hardware.camera" android:required="false" />',
          ]
          marker = '<application'
          if marker not in s:
              raise SystemExit("Android manifest has no application element")
          prefix = s[:s.index(marker)]
          suffix = s[s.index(marker):]
          for item in permissions:
              if item.strip() not in prefix:
                  prefix += item + "\n"
          p.write_text(prefix + suffix)
          PY

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MobiPay-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
